<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics</title>
  <link rel="shortcut icon" href="../Images/img2.png" type="image/x-icon">
  <link rel="stylesheet" href="watch.css">
</head>

<body>

  <header class="navbar">

    <div class="logo">
      ▶ My Lyrics
    </div>

    <button id="themeToggle" class="theme-btn">🌙</button>

  </header>

  <div class="box">

    <div class="lyricscontainer">
      <h3 id="songName">Hello</h3>
      <pre id="lyricsBox"></pre>
    </div>

    <div class="infocontainer">

      <div class="iframecontainer">
        <iframe id="videoPlayer" title="YouTube video player" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <h1 style="text-align: center;padding: 20px;font-size: 30px">Related songs</h1>

      <div class="recommendationcontainer">
            <!-- Recommendation of songs -->
      </div>

    </div>

  </div>



  <script src="watch.js"></script>
</body>

</html>
