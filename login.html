<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="https://lyrics-bangla-geet.netlify.app/Images/img2.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        :root {
            --bg: #0f172a;
            /* deep navy */
            --text: #e2e8f0;
            --card: #1e293b;
            --border: #334155;
            --drawer: #020617;

            --primary: #22c55e;
            /* green accent */
            --secondary: #3b82f6;
            /* blue */
        }

        .dark-mode {
            --bg: #020617;
            --text: #f1f5f9;
            --card: #0f172a;
            --border: #1e293b;
            --drawer: #000;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text);
            transition: 0.3s;
        }

        .login-box {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .theme-btn {
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--border);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            color: var(--text);
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 400px) {
            .login-box {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>🔐 Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="error" id="errorMsg">Invalid input</p>

        <button class="theme-btn" id="themeToggle">🌙 Toggle Mode</button>
    </div>

    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const sender = urlParams.get("id");

        const form = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (username === "" || password === "") {
                errorMsg.style.display = "block";
                errorMsg.innerText = "Please fill all fields";
                return;
            }

            if (password.length < 4) {
                errorMsg.style.display = "block";
                errorMsg.innerText = "Password must be at least 4 characters";
                return;
            }

            if (username === "shabbir" && password === "108349") {
                if (sender === "upload") {
                    window.location.href = "https://lyrics-bangla-geet.netlify.app/upload/upload.html";
                } else if (sender === "editor") {
                    window.location.href = "https://lyrics-bangla-geet.netlify.app/Editor/editor.html"
                }else if(sender === "admin"){
                    window.location.href = "https://lyrics-bangla-geet.netlify.app/Admin/adminManagesong.html"
                }
            } else {
                errorMsg.style.display = "block";
                errorMsg.innerText = "Credentials is invalid";
            }


        });

        // 🌙 Dark mode
        document.getElementById("themeToggle").addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>

</body>

</html>
