<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics</title>
  <link rel="stylesheet" href="watch.css">
</head>

<body>

  <header class="navbar">

    <div class="logo">
      ▶ My Lyrics
    </div>
    <div>
      <svg class="searchsvg" id="serach-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
    </div>
    <input type="text" placeholder="Search..." class="search-box" id="songInput">


    <button id="themeToggle" class="theme-btn">🌙</button>

  </header>

  <div class="box">

    <div class="lyricscontainer">
      <h3 id="songName">Hello</h3>
      <pre id="lyricsBox"></pre>
    </div>

    <div class="infocontainer">

      <div class="iframecontainer">
        <iframe id="videoPlayer" title="YouTube video player" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <h1 style="text-align: center;padding: 20px;font-size: 30px">Recommended Some<br>Song</h1>

      <div class="recommendationcontainer">

        <!-- <div class="songItem">
          <img class="songThumb" src="thumb.jpg">
          <div class="songTitle">Gehra Hua - Arijit Singh</div>
        </div> -->
      </div>

    </div>

  </div>



  <script src="watch.js"></script>
</body>

</html>
